<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบสถานะพัสดุ - GOODSTONE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK (Real-time Cloud Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-sync.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
            <style>
        body { font-family: "Prompt", sans-serif; transition: background-color 0.2s ease, color 0.2s ease; margin: 0; padding: 0; }
        
        /* 🌙 Dark Theme (DEFAULT) */
        :root, [data-theme="dark"] {
            --bg-body: #121215;
            --bg-header: #1A1A20;
            --bg-card: #1F1F26;
            --bg-card-subtle: #272732;
            --bg-input: #181820;
            --border-main: #333342;
            --border-subtle: #2A2A38;
            --text-main: #F4F0EA;
            --text-muted: #A1A1B0;
            --badge-bg: #2E1B17;
            --badge-border: #5C2B1F;
            --badge-text: #FF6E4E;
        }

        /* ☀️ Light Theme (Warm Cream) */
        [data-theme="light"] {
            --bg-body: #F9F6F0;
            --bg-header: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #FAF7F2;
            --bg-input: #FAF7F2;
            --border-main: #EBE3D5;
            --border-subtle: #F0EAE1;
            --text-main: #2C241E;
            --text-muted: #64748B;
            --badge-bg: #FFF2EE;
            --badge-border: #FFD5CC;
            --badge-text: #EE4D2D;
        }

        .theme-body { background-color: var(--bg-body) !important; color: var(--text-main) !important; }
        .theme-header { background-color: var(--bg-header) !important; border-color: var(--border-main) !important; }
        .theme-card { background-color: var(--bg-card) !important; border-color: var(--border-main) !important; color: var(--text-main) !important; }
        .theme-card-subtle { background-color: var(--bg-card-subtle) !important; border-color: var(--border-subtle) !important; }
        .theme-input { background-color: var(--bg-input) !important; border-color: var(--border-main) !important; color: var(--text-main) !important; }
        .theme-text-main { color: var(--text-main) !important; }
        .theme-text-muted { color: var(--text-muted) !important; }
    </style>
</head>
<body class="bg-[#F9F6F0] text-[#2C241E] min-h-screen py-10 px-4 font-sans">
    <div class="max-w-2xl mx-auto space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-[#FFF2EE] text-[#EE4D2D] rounded-3xl flex items-center justify-center mx-auto text-2xl shadow-inner border border-[#FFD5CC]">
                🚚
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-[#2C241E]">ตรวจสอบสถานะพัสดุ</h1>
            <p class="text-xs sm:text-sm text-slate-500">กรอกเพียงเบอร์โทรศัพท์ที่ใช้สั่งซื้อ หรือรหัสคำสั่งซื้อ</p>
        </div>

        <div class="bg-white p-5 rounded-3xl border-2 border-[#EBE3D5] shadow-sm space-y-3">
            <div class="flex gap-2">
                <input type="text" id="track-q" placeholder="ระบุเบอร์โทรศัพท์ (เช่น 0819998877) หรือ ORD-..." class="flex-grow px-4 py-3 bg-[#FAF7F2] border border-[#EBE3D5] rounded-2xl text-sm focus:ring-2 focus:ring-[#EE4D2D] focus:bg-white text-[#2C241E]">
                <button onclick="doTrack()" class="bg-[#EE4D2D] hover:bg-[#d73211] text-white font-bold px-6 py-3 rounded-2xl text-sm transition-all shadow-md active:scale-95">
                    ค้นหา
                </button>
            </div>
        </div>

        <div id="track-results-container" class="space-y-4"></div>

        <div class="text-center pt-4">
            <a href="index.html" class="text-xs font-bold text-[#EE4D2D] hover:underline">← กลับไปหน้าร้านค้าสั่งซื้อสินค้า</a>
        </div>
    </div>

    <script>
        const DEFAULT_ORDERS = []; // [{"id": "ORD-20260817-001", "customer_name": "สมชาย ใจดี", "phone": "081-999-8877", "address": "45/2 หมู่ 3 ต.บางกระดี่ อ.เมือง จ.สมุทรปราการ 10270", "shipping_provider": "ไปรษณีย์ไทย (EMS)", "shipping_cost": 0.0, "subtotal": 540.0, "total_amount": 540.0, "status": "PAID", "payment_method": "PromptPay (พร้อมเพย์)", "tracking_number": "ED102708892TH", "items": [{"product_id": "PROD-001", "name": "หนังสติ๊กอัลลอยด์ยุทธวิธี พร้อมเลเซอร์ช่วยเล็ง", "price": 390.0, "quantity": 1}, {"product_id": "PROD-005", "name": "ลูกเหล็กกลมขัดเงา 8 มม.", "price": 150.0, "quantity": 1}], "created_at": "2026-08-17 10:15:00"}, {"id": "ORD-20260817-002", "customer_name": "กิตติพงษ์ ยอดเยี่ยม", "phone": "082-345-6789", "address": "99 อาคารสุขใจ ชั้น 4 ถ.พหลโยธิน แขวงสามเสนใน เขตพญาไท กทม. 10400", "shipping_provider": "ไปรษณีย์ไทย (EMS)", "shipping_cost": 0.0, "subtotal": 690.0, "total_amount": 690.0, "status": "PAID", "payment_method": "PromptPay (พร้อมเพย์)", "tracking_number": "ED820399482TH", "items": [{"product_id": "PROD-002", "name": "หนังสติ๊กสแตนเลส CNC ด้ามไม้ประกบ", "price": 550.0, "quantity": 1}, {"product_id": "PROD-004", "name": "ยางหนังสติ๊กแบน 1.0mm (5 เส้น)", "price": 140.0, "quantity": 1}], "created_at": "2026-08-17 11:30:20"}, {"id": "ORD-20260817-003", "customer_name": "วิชัย มุ่งมั่น", "phone": "086-777-1234", "address": "12/8 ต.ในเมือง อ.เมือง จ.นครราชสีมา 30000", "shipping_provider": "ไปรษณีย์ไทย (EMS)", "shipping_cost": 0.0, "subtotal": 380.0, "total_amount": 380.0, "status": "PAID", "payment_method": "PromptPay (พร้อมเพย์)", "tracking_number": "ED300005521TH", "items": [{"product_id": "PROD-003", "name": "ยางหนังสติ๊กแบน 0.75mm (5 เส้น)", "price": 120.0, "quantity": 2}, {"product_id": "PROD-004", "name": "ยางหนังสติ๊กแบน 1.0mm (5 เส้น)", "price": 140.0, "quantity": 1}], "created_at": "2026-08-17 11:55:00"}, {"id": "ORD-20260817-004", "customer_name": "ธนพล รุ่งเรือง", "phone": "089-444-5566", "address": "77/1 ต.บ้านคลอง อ.เมือง จ.พิษณุโลก 65000", "shipping_provider": "ไปรษณีย์ไทย (EMS)", "shipping_cost": 25.0, "subtotal": 120.0, "total_amount": 145.0, "status": "PAID", "payment_method": "PromptPay (พร้อมเพย์)", "tracking_number": "ED650001294TH", "items": [{"product_id": "PROD-003", "name": "ยางหนังสติ๊กแบน 0.75mm (5 เส้น)", "price": 120.0, "quantity": 1}], "created_at": "2026-08-17 12:40:10"}];
        function doTrack() {
            const q = document.getElementById('track-q').value.trim().replace(/[^0-9a-zA-Z-]/g, '').toLowerCase();
            const container = document.getElementById('track-results-container');
            if (!q) { alert('กรุณาระบุเบอร์โทรศัพท์ครับ'); return; }

            let orders = DEFAULT_ORDERS;
            const saved = localStorage.getItem('goodstone_orders');
            if (saved) { try { orders = JSON.parse(saved); } catch(e) {} }

            const matches = orders.filter(o => {
                const oId = (o.id || '').replace(/-/g, '').toLowerCase();
                const oPhone = (o.phone || '').replace(/-/g, '').toLowerCase();
                return oId.includes(q.replace(/-/g, '')) || oPhone.includes(q.replace(/-/g, ''));
            });

            if (matches.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-3xl border-2 border-[#EBE3D5] text-center space-y-2"><span class="text-3xl">🔍</span><h3 class="font-bold text-[#2C241E]">ไม่พบคำสั่งซื้อ</h3><p class="text-xs text-slate-500">โปรดตรวจสอบเบอร์โทรศัพท์อีกครั้งครับ</p></div>`;
                return;
            }

            container.innerHTML = '';
            matches.forEach(o => {
                const isEMS = o.carrier_type === 'THAILAND_POST_EMS' || (o.shipping_provider && o.shipping_provider.includes('ไปรษณีย์'));
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-3xl border-2 border-[#EBE3D5] shadow-sm space-y-4';
                div.innerHTML = `
                    <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                        <div>
                            <span class="text-[11px] text-slate-400">รหัสคำสั่งซื้อ</span>
                            <h3 class="text-base font-black text-[#2C241E]">${o.id}</h3>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-300">
                            ${o.status === 'SHIPPED' ? '✓ จัดส่งแล้ว' : 'ชำระแล้ว (รอแพ็ก)'}
                        </span>
                    </div>

                    ${o.tracking_number ? `
                        <div class="bg-[#FAF7F2] border-2 border-[#EBE3D5] text-[#2C241E] p-4 rounded-2xl flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-500">ขนส่ง: ${o.shipping_provider}</span>
                                <p class="text-lg font-mono font-black text-[#EE4D2D]">${o.tracking_number}</p>
                            </div>
                            <span class="bg-[#EE4D2D] text-white text-xs px-3 py-1.5 rounded-xl font-bold">
                                ${isEMS ? 'ไปรษณีย์ไทย EMS' : 'SPX Express'}
                            </span>
                        </div>
                    ` : `
                        <div class="bg-[#FFF5F2] text-[#2C241E] p-3.5 rounded-2xl text-xs font-medium border border-[#FFD5CC]">
                            ⏳ ร้านค้าได้รับยอดเงินเรียบร้อยแล้ว อยู่ระหว่างจัดเตรียมสินค้าและออกเลขพัสดุ
                        </div>
                    `}

                    <div class="text-xs text-slate-600 space-y-1">
                        <p><strong>ผู้รับ:</strong> ${o.customer_name} (${o.phone})</p>
                        <p><strong>ที่อยู่จัดส่ง:</strong> ${o.address}</p>
                        <div class="pt-2 border-t border-slate-100">
                            <strong>รายการสินค้า:</strong>
                            <ul class="list-disc pl-5 pt-1">
                                ${o.items.map(i => `<li>${i.name} x${i.quantity} (฿${i.price})</li>`).join('')}
                            </ul>
                        </div>
                        <div class="pt-2 flex justify-between items-center text-sm font-black text-[#2C241E] border-t border-slate-100">
                            <span>ยอดชำระสุทธิ:</span>
                            <span class="text-[#EE4D2D] text-base">฿${Number(o.total_amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
